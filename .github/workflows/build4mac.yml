name: Build and Release for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          repository: w3K-co/shpool

      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          repository: shell-pool/shpool
          path: original-repo

      # Use libshpool instead of shpool_pty
      - name: Extract libshpool directory
        run: |
          mv original-repo/libshpool ./
          ls -l libshpool  # Verify it exists

      - name: Create .cargo/config.toml for patch
        run: |
          mkdir -p .cargo
          echo '[patch.crates-io]' > .cargo/config.toml
          # Patch both dependencies that might be needed
          echo 'libshpool = { path = "libshpool" }' >> .cargo/config.toml
          echo 'shpool_pty = { path = "libshpool" }' >> .cargo/config.toml
          cat .cargo/config.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Rename the binary
        run: mv target/${{ matrix.target }}/release/shpool target/${{ matrix.target }}/release/shpool-${{ matrix.target }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shpool-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shpool-${{ matrix.target }}
          retention-days: 1
          