name: Build and Release for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          repository: w3K-co/shpool

      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          repository: shell-pool/shpool
          path: original-repo

      - name: List all files in original-repo for debugging
        run: ls -lR original-repo

      - name: Move shpool_pty directory if present
        run: |
          SHPOOL_PTY_PATH=$(find original-repo -type d -name shpool_pty | head -n 1)
          if [ -n "$SHPOOL_PTY_PATH" ]; then
            mv "$SHPOOL_PTY_PATH" ./
            echo "Moved shpool_pty from $SHPOOL_PTY_PATH to ./"
          else
            echo "ERROR: shpool_pty not found in original-repo"
            exit 1
          fi

      - name: Create .cargo/config.toml for patch
        run: |
          mkdir -p .cargo
          echo '[patch.crates-io]' > .cargo/config.toml
          echo 'shpool_pty = { path = "shpool_pty" }' >> .cargo/config.toml
          cat .cargo/config.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename the binary
        run: mv target/${{ matrix.target }}/release/shpool target/${{ matrix.target }}/release/shpool-${{ matrix.target }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shpool-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shpool-${{ matrix.target }}
          retention-days: 1
