# macOS Build Workflow
# This workflow is dedicated to building binaries for macOS.
# It resolves the shpool_pty dependency issue by fetching the patched
# version from the original repository and using a Cargo [patch] directive.

name: Build and Release (macOS)

on:
  workflow_dispatch:  # Allows manual execution of the workflow

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      # Step 1: Checkout your forked repository
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          repository: w3K-co/shpool

      # Step 2: Install Subversion (svn)
      # svn is a reliable tool for downloading a specific subdirectory from a Git repository.
      - name: Install svn
        run: brew install svn

      # Step 3: Download the patched pty dependency using svn
      # This is more robust than cloning the entire repository and avoids workspace issues.
      - name: Download patched pty dependency
        run: svn export https://github.com/shell-pool/shpool/trunk/shpool_pty

      # Step 4: Create Cargo config to patch the dependency
      # This tells Cargo to use the local version of shpool_pty we just downloaded
      # instead of trying to download it from crates.io.
      - name: Create .cargo/config.toml for patch
        run: |
          mkdir -p .cargo
          echo '[patch.crates-io]' > .cargo/config.toml
          echo 'shpool_pty = { path = "shpool_pty" }' >> .cargo/config.toml
          echo "Created .cargo/config.toml:"
          cat .cargo/config.toml

      # Step 5: Set up the Rust toolchain
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Step 6: Build the binary. No special flags are needed now.
      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
      
      # Step 7: Rename the binary for upload
      - name: Rename the binary
        run: mv target/${{ matrix.target }}/release/shpool target/${{ matrix.target }}/release/shpool-${{ matrix.target }}

      # Step 8: Upload the artifact
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shpool-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shpool-${{ matrix.target }}
          retention-days: 1
