# Updated GitHub Actions Workflow: Build and Release
# This workflow is based on the original user-provided file, with minimal
# updates to fix deprecated actions and resolve compilation errors.

name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers the workflow when a new version tag is pushed
  workflow_dispatch:  # Allows manual execution of the workflow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl]

    steps:
      # Step 1: Checkout the code (Updated to v4)
      - name: Checkout the code
        uses: actions/checkout@v4

      # Step 2: Remove the local toolchain file to use the one from the action.
      # This is the key fix. It forces the build to use the modern Rust
      # version installed in the next step, instead of the old version
      # specified in the repository's rust-toolchain.toml file.
      - name: Remove local rust-toolchain.toml
        run: rm -f rust-toolchain.toml

      # Step 3: Set up Rust toolchain (Updated to a modern action to fix 'cross' install)
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Step 4: Install musl-tools if building for a musl target (Original logic)
      - name: Install musl-tools for static linking
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Step 5: Install 'cross' for cross-compilation (Original logic)
      - name: Install cross for cross-compilation
        if: contains(matrix.target, 'aarch64')
        run: cargo install cross

      # Step 6: Build the binary (Original logic)
      - name: Build binary
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" || "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      
      # Step 7: Rename the binary (Original logic)
      - name: Rename the binary
        run: mv target/${{ matrix.target }}/release/shpool target/${{ matrix.target }}/release/shpool-${{ matrix.target }}

      # Step 8: Upload release asset (Updated to v4 to fix deprecation error)
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shpool-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shpool-${{ matrix.target }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required by softprops/action-gh-release

    steps:
      # Step 1: Download all artifacts (Updated to v4 and consolidated)
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Step 2: List downloaded files (Original logic, path updated)
      - name: List downloaded files
        run: ls -R artifacts

      # Step 3: Create a release (Updated to v2)
      - name: Create a release
        uses: softprops/action-gh-release@v2
        with:
          # files path updated to work with the consolidated download
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
