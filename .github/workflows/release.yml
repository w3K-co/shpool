# Updated GitHub Actions Workflow: Build and Release
# This workflow builds binaries for multiple Rust targets and creates a GitHub Release.
# It has been updated to use the latest versions of actions (as of mid-2024).

name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers the workflow when a new version tag is pushed (e.g., v1.0, v2.3.4)
  workflow_dispatch:  # Allows manual execution of the workflow from the Actions tab

jobs:
  # This job builds the binaries for all specified targets in parallel.
  build:
    runs-on: ubuntu-latest
    strategy:
      # The matrix allows us to run the same steps for different configurations.
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl]

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout the code
        uses: actions/checkout@v4

      # Step 2: Set up Rust and install 'cross' using the official cross-rs action.
      # This replaces the separate toolchain and install steps for better compatibility.
      - name: Set up Rust and Cross
        uses: cross-rs/cross-toolchain@main
        with:
          target: ${{ matrix.target }}

      # Step 3: Install musl-tools if building for a musl target
      - name: Install musl-tools for static linking
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Step 4: Build the binary. Use 'cross' for aarch64, otherwise use 'cargo'.
      - name: Build binary
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" || "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Step 5: Prepare artifact for upload by renaming it
      - name: Prepare artifact
        run: |
          ARTIFACT_NAME="shpool-${{ matrix.target }}"
          mv target/${{ matrix.target }}/release/shpool "target/${{ matrix.target }}/release/${ARTIFACT_NAME}"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      # Step 6: Upload the built binary as a workflow artifact
      # Using actions/upload-artifact@v4
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/${{ matrix.target }}/release/${{ env.ARTIFACT_NAME }}
          retention-days: 1 # Keep artifacts for 1 day

  # This job runs after all build jobs are complete. It creates the GitHub Release.
  release:
    needs: build # This job depends on the 'build' job finishing successfully
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      # Step 1: Download all artifacts built in the previous job
      # actions/download-artifact@v4 can download all artifacts at once
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts into a directory named 'artifacts'

      # Step 2: List downloaded files to verify (optional)
      - name: List downloaded files
        run: ls -R artifacts

      # Step 3: Create the GitHub Release and upload the binaries
      # Using softprops/action-gh-release@v2
      - name: Create a release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          # The 'files' glob pattern finds all the downloaded binaries to attach to the release.
          files: artifacts/**/*
        env:
          # The GITHUB_TOKEN is automatically provided by GitHub Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
