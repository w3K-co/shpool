# Updated GitHub Actions Workflow: Build and Release
# This workflow builds binaries for Linux and macOS, then creates a
# GitHub Release only when a new version tag is pushed.

name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers the workflow when a new version tag is pushed
  workflow_dispatch:  # Allows manual execution of the workflow (will not create a release)

jobs:
  # Job to build for all Linux targets
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Remove local rust-toolchain.toml
        run: rm -f rust-toolchain.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools for static linking
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross for cross-compilation
        if: contains(matrix.target, 'aarch64')
        run: cargo install cross

      - name: Build binary
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" || "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      
      - name: Rename the binary
        run: mv target/${{ matrix.target }}/release/shpool target/${{ matrix.target }}/release/shpool-${{ matrix.target }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shpool-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shpool-${{ matrix.target }}
          retention-days: 1

  # Job to build for all macOS targets
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Remove local rust-toolchain.toml
        run: rm -f rust-toolchain.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # This is the key fix for the macOS build failure.
      # The shpool_pty dependency uses a Linux-specific function (ptsname_r)
      # that doesn't exist on macOS. This step patches the dependency's
      # source code after it's downloaded by Cargo to use the correct
      # function for macOS before the build starts.
      - name: Patch shpool_pty for macOS compatibility
        run: |
          # First, download the dependencies without building them
          cargo fetch
          # Find the problematic source file in the cargo registry
          SHPOOL_PTY_SRC=$(find ~/.cargo/registry/src -name "shpool_pty-0.3.1" -type d)
          PTY_MASTER_MOD_RS="$SHPOOL_PTY_SRC/src/fork/pty/master/mod.rs"
          # Check if the file exists before trying to patch it
          if [ -f "$PTY_MASTER_MOD_RS" ]; then
            echo "Patching $PTY_MASTER_MOD_RS..."
            # Replace the Linux function with a block that works on macOS
            sed -i.bak 's/match libc::ptsname_r(fd, data as \*mut libc::c_char, buf.len()) {/let ptsname_ptr = libc::ptsname(fd); if ptsname_ptr.is_null() { Err(io::Error::last_os_error()) } else { let len = str_len(ptsname_ptr) + 1; data[..len].copy_from_slice(slice::from_raw_parts(ptsname_ptr as *const u8, len)); Ok(0) }; match 0 {/' "$PTY_MASTER_MOD_RS"
            echo "Patch applied successfully."
          else
            echo "::warning::Could not find shpool_pty source file to patch. The build may fail if the dependency is used."
          fi

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Rename the binary
        run: mv target/${{ matrix.target }}/release/shpool target/${{ matrix.target }}/release/shpool-${{ matrix.target }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shpool-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shpool-${{ matrix.target }}
          retention-days: 1

  # This job creates the release and uploads all artifacts.
  release:
    needs: [build-linux, build-macos] # Depends on both build jobs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # This condition allows the job to run on tag pushes and manual triggers.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      # We must check out the code to be able to find the latest tag.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all tags

      - name: Generate release tag
        id: generate_tag
        run: |
          # Get the base tag name depending on the event type
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # For pushes, use the tag that triggered the workflow
            BASE_TAG=${{ github.ref_name }}
          else
            # For manual dispatches, try to get the latest tag.
            # The '|| true' part prevents the script from exiting if git describe fails.
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            
            if [[ -z "$LATEST_TAG" ]]; then
              # If no tags were found, set the base tag to v0.0.1
              echo "No previous tags found. Using v0.0.1 as base."
              BASE_TAG="v0.0.1"
            else
              # If a tag was found, strip any potential timestamp prefix
              echo "Found latest tag: $LATEST_TAG"
              BASE_TAG=${LATEST_TAG##*-}
            fi
          fi
          
          # Generate the timestamp in UTC for consistency
          TIMESTAMP=$(date -u +'%y%m%d-%H%M%S')
          
          # Combine them into the new tag format
          NEW_TAG="${TIMESTAMP}-${BASE_TAG}"
          
          echo "Generated new tag: $NEW_TAG"
          echo "NEW_TAG_NAME=$NEW_TAG" >> $GITHUB_ENV

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: ls -R artifacts

      - name: Create a release
        uses: softprops/action-gh-release@v2
        with:
          # Use the custom tag generated in the previous step
          tag_name: ${{ env.NEW_TAG_NAME }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
